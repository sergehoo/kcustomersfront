    <script>
      // Start the villa download immediately instead of waiting for three.js to
      // parse and execute. The variant must match ExteriorVilla's breakpoint.
      (function () {
        var mobile = window.matchMedia('(max-width: 767px)').matches
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'fetch'
        link.crossOrigin = 'anonymous'
        link.href = '/models/production/kaydan-villa-production-' + (mobile ? 'mobile' : 'web') + '.glb'
        document.head.appendChild(link)
      })()
    </script>
